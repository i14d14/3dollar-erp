[pytest]
# Default to unit/integration tests only (~3s execution)
testpaths = tests/unit

# Prevent recursion into e2e tests even if 'pytest tests' is executed
norecursedirs = e2e .git .venv

# Ensure root directory is in pythonpath for standalone pytest execution
pythonpath = .

# Default browser options for Playwright fixtures when e2e tests are explicitly invoked
addopts = --headed

# Registered test markers
markers =
    e2e: Playwright browser UI end-to-end tests
    unit: Fast in-process unit and integration tests
