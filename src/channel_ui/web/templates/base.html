<!DOCTYPE html>
<html lang="zh-TW" class="h-full bg-slate-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}3Dollar ERP 管理後台{% endblock %}</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- HTMX CDN -->
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <script>
    document.addEventListener('htmx:beforeSwap', function(evt) {
      // 2xx (成功完成): 自動清理過往殘留之錯誤通知橫幅
      if (evt.detail.xhr.status >= 200 && evt.detail.xhr.status < 300) {
        const toast = document.getElementById('toast-container');
        if (toast) toast.innerHTML = '';
      }
      // 4xx (業務預期防呆): 允許處理，配合後端 OOB 放入通知區
      else if (evt.detail.xhr.status >= 400 && evt.detail.xhr.status < 500) {
        evt.detail.shouldSwap = true;
        evt.detail.isError = false;
      }
      // 5xx (未預期崩潰): 嚴格禁止抽換主要 DOM，防止醜陋報錯破壞畫面
      else if (evt.detail.xhr.status >= 500) {
        evt.detail.shouldSwap = false;
        const toast = document.getElementById('toast-container');
        if (toast) {
          toast.innerHTML = `
            <div class="p-3 my-2 text-xs text-rose-800 bg-rose-50 border border-rose-300 rounded-lg flex items-center justify-between shadow-sm">
              <div class="flex items-center gap-2">
                <span class="text-rose-600 font-bold text-sm">🚨</span>
                <span class="font-medium">系統內部發生異常，已自動阻斷原始報錯並保全畫面，請稍後重試。</span>
              </div>
              <button onclick="document.getElementById('toast-container').innerHTML=''" class="text-rose-400 hover:text-rose-700 font-bold ml-2 text-base leading-none">&times;</button>
            </div>`;
        }
      }
    });
  </script>
  <style>
    .htmx-indicator { display: none; }
    .htmx-request .htmx-indicator { display: inline-block; }
    .htmx-request.htmx-indicator { display: inline-block; }
  </style>
</head>
<body class="h-full flex flex-col md:flex-row font-sans text-slate-800 antialiased">
  
  <!-- Desktop Sidebar Navigation -->
  <aside class="w-full md:w-64 bg-slate-900 text-slate-200 flex flex-col flex-shrink-0 shadow-lg">
    <!-- Brand Logo -->
    <div class="h-16 flex items-center px-6 border-b border-slate-800 gap-3">
      <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center font-bold text-white shadow">
        3$
      </div>
      <div>
        <div class="font-bold tracking-wide text-white text-base">3Dollar ERP</div>
        <div class="text-xs text-slate-400">三圓科技架構引擎</div>
      </div>
    </div>

    <!-- Navigation Menu -->
    <nav class="flex-1 px-3 py-4 space-y-1">
      <a href="/" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors {% if active_page == 'dashboard' %}bg-indigo-600 text-white shadow-sm{% else %}text-slate-300 hover:bg-slate-800 hover:text-white{% endif %}">
        <svg class="w-5 h-5 opacity-80" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
        營運儀表板
      </a>

      <a href="/orders" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors {% if active_page == 'orders' %}bg-indigo-600 text-white shadow-sm{% else %}text-slate-300 hover:bg-slate-800 hover:text-white{% endif %}">
        <svg class="w-5 h-5 opacity-80" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/></svg>
        訂單與出貨作業
      </a>

      <a href="/inventory" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors {% if active_page == 'inventory' %}bg-indigo-600 text-white shadow-sm{% else %}text-slate-300 hover:bg-slate-800 hover:text-white{% endif %}">
        <svg class="w-5 h-5 opacity-80" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
        多倉庫存與流水
      </a>

      <a href="/accounting" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors {% if active_page == 'accounting' %}bg-indigo-600 text-white shadow-sm{% else %}text-slate-300 hover:bg-slate-800 hover:text-white{% endif %}">
        <svg class="w-5 h-5 opacity-80" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        探吉 會計記帳
      </a>

      <a href="/crm" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors {% if active_page == 'crm' %}bg-indigo-600 text-white shadow-sm{% else %}text-slate-300 hover:bg-slate-800 hover:text-white{% endif %}">
        <svg class="w-5 h-5 opacity-80" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
        哩來 CRM 商機
      </a>

      <a href="/ai/tools" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors {% if active_page == 'ai_tools' %}bg-indigo-600 text-white shadow-sm{% else %}text-slate-300 hover:bg-slate-800 hover:text-white{% endif %}">
        <svg class="w-5 h-5 opacity-80" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
        AI 檔案自動化
      </a>
    </nav>

    <!-- Footer System Status -->
    <div class="p-4 border-t border-slate-800 text-xs text-slate-400">
      <div class="flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        <span class="font-mono">SQLite + SSR + HTMX</span>
      </div>
      <div class="mt-1 text-slate-500">MIG 3.2.1 • 4-Way Match</div>
    </div>
  </aside>

  <!-- Main Content Area -->
  <main class="flex-1 flex flex-col min-w-0 overflow-y-auto">
    <!-- Top Bar -->
    <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-6 sticky top-0 z-10 shadow-sm">
      <h1 class="text-xl font-bold text-slate-900">{% block header_title %}管理後台{% endblock %}</h1>
      <div class="flex items-center gap-3">
        <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-emerald-50 text-emerald-700 border border-emerald-200">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
          雙記帳流水運作中
        </span>
      </div>
    </header>

    <!-- Global Floating Toast Notification Layer (Above Modals & Headers) -->
    <div id="toast-container" class="fixed top-5 left-1/2 -translate-x-1/2 z-[9999] w-full max-w-xl px-4 pointer-events-auto empty:hidden transition-all duration-300"></div>

    <!-- Global Modal Container for Orders, Deliveries & Labels -->
    <div id="order-modal-container"></div>

    <!-- Page Body -->
    <div class="p-6 flex-1">
      {% block content %}{% endblock %}
    </div>
  </main>

</body>
</html>
