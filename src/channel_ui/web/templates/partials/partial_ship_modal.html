<div id="partial-ship-modal" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-2xl max-w-lg w-full overflow-hidden border border-slate-200">
    <div class="p-5 border-b border-slate-100 flex items-center justify-between bg-slate-50/50">
      <div>
        <h3 class="font-bold text-slate-800 text-base">拆批出貨 (Partial Fulfillment)</h3>
        <p class="text-xs text-slate-500 font-mono mt-0.5">訂單編號：{{ order.order_id }}</p>
      </div>
      <button type="button" onclick="document.getElementById('partial-ship-modal').remove()" class="text-slate-400 hover:text-slate-700 text-lg leading-none">&times;</button>
    </div>
    
    <form hx-post="/orders/{{ order.order_id }}/ship-partial"
          hx-target="#order-row-{{ order.order_id }}"
          hx-swap="outerHTML"
          hx-on::after-request="if(event.detail.xhr && event.detail.xhr.status >= 200 && event.detail.xhr.status < 300) { document.getElementById('partial-ship-modal').remove(); }"
          novalidate
          class="p-5 space-y-4">
      
      <p class="text-xs text-slate-600">請設定本次各商品出貨數量（未出貨部分將持續維持鎖庫）：</p>
      
      <div class="border border-slate-200 rounded-lg overflow-hidden divide-y divide-slate-100 text-xs">
        <div class="grid grid-cols-12 bg-slate-50 p-2 font-medium text-slate-500">
          <div class="col-span-6">商品 SKU</div>
          <div class="col-span-3 text-center">訂購 / 剩餘</div>
          <div class="col-span-3 text-right">本次出貨量</div>
        </div>
        {% for item in order.items %}
        <div class="grid grid-cols-12 p-2.5 items-center">
          <div class="col-span-6 font-mono font-medium text-slate-800">
            {{ item.sku }}
          </div>
          <div class="col-span-3 text-center text-slate-600">
            {{ item.qty|int }} / <span class="font-semibold text-indigo-600">{{ item.remaining_qty|int }}</span>
          </div>
          <div class="col-span-3 flex justify-end">
            {% if item.remaining_qty > 0 %}
            <input type="number" 
                   name="qty_{{ item.item_id }}" 
                   value="{{ item.remaining_qty|int }}" 
                   min="0" 
                   max="{{ item.remaining_qty|int }}" 
                   step="1"
                   class="w-20 px-2 py-1 text-right border border-slate-300 rounded focus:ring-1 focus:ring-indigo-500 focus:border-indigo-500 text-xs font-mono font-semibold" />
            {% else %}
            <span class="text-slate-400 font-medium">已全出</span>
            {% endif %}
          </div>
        </div>
        {% endfor %}
      </div>

      <div class="flex items-center justify-end gap-2 pt-2 border-t border-slate-100">
        <button type="button" onclick="document.getElementById('partial-ship-modal').remove()" class="px-3 py-1.5 border border-slate-300 rounded-lg text-xs font-medium text-slate-600 hover:bg-slate-50">
          取消
        </button>
        <button type="submit" class="px-3.5 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs font-semibold shadow-sm transition">
          確認拆批出貨
        </button>
      </div>
    </form>
  </div>
</div>
