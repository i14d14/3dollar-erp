# 3Dollar ERP UI Component Manifest (SSOT)
# Governed by software-architecture and frontend engineering testability standards.
# All declared data-testid entries are verified against live templates via tests/test_ui_manifest_contract.py.

version: "1.0"
description: "Authoritative Single Source of Truth (SSOT) for all testable web elements in 3Dollar ERP"

modules:
  global:
    route: "*"
    elements:
      - testid: "toast-container"
        type: "container"
        description: "全域懸浮通知容器"
      - testid: "toast-card"
        type: "card"
        description: "單筆 Toast 狀態卡片"
      - testid: "toast-message"
        type: "text"
        description: "Toast 訊息內文字串"
      - testid: "btn-toast-undo"
        type: "button"
        description: "Toast 5-8s 倒數撤回按鈕"
      - testid: "btn-toast-dismiss"
        type: "button"
        description: "Toast 手動關閉按鈕"
      - testid: "nav-dashboard"
        type: "link"
        description: "側邊欄導航：營運儀表板"
      - testid: "nav-orders"
        type: "link"
        description: "側邊欄導航：訂單與出貨作業"
      - testid: "nav-procurement"
        type: "link"
        description: "側邊欄導航：採購與進貨作業"
      - testid: "nav-inventory"
        type: "link"
        description: "側邊欄導航：多倉庫存與流水"
      - testid: "nav-accounting"
        type: "link"
        description: "側邊欄導航：探吉會計記帳"
      - testid: "nav-crm"
        type: "link"
        description: "側邊欄導航：哩來 CRM 商機"
      - testid: "nav-ai-tools"
        type: "link"
        description: "側邊欄導航：檔案自動化"

  orders:
    route: "/orders"
    elements:
      - testid: "table-orders"
        type: "table"
        description: "訂單總覽清單表格"
      - testid: "orders-tbody"
        type: "tbody"
        description: "訂單列表資料主體"
      - testid: "row-order"
        type: "tr"
        description: "單筆訂單資料行"
      - testid: "btn-confirm-order"
        type: "button"
        description: "DRAFT 訂單鎖庫確認按鈕"
      - testid: "btn-partial-ship"
        type: "button"
        description: "拆批出貨 Modal 開啟按鈕"
      - testid: "btn-ship-order"
        type: "button"
        description: "一鍵出貨（扣庫）按鈕"
      - testid: "btn-issue-invoice"
        type: "button"
        description: "電子發票開立按鈕"

  inventory:
    route: "/inventory"
    elements:
      - testid: "btn-export-stock-valuation"
        type: "link"
        description: "匯出雙倉庫存盤點底冊 Excel 按鈕"
      - testid: "form-stock-transfer"
        type: "form"
        description: "多倉調撥作業表單"
      - testid: "select-transfer-from"
        type: "select"
        description: "調撥來源倉庫下拉選單"
      - testid: "select-transfer-to"
        type: "select"
        description: "調撥目的倉庫下拉選單"
      - testid: "input-transfer-sku"
        type: "input"
        description: "調撥品號 (SKU) 輸入框"
      - testid: "input-transfer-qty"
        type: "input"
        description: "調撥數量輸入框"
      - testid: "btn-submit-transfer"
        type: "button"
        description: "執行多倉調撥送出按鈕"
      - testid: "table-stock-balances"
        type: "table"
        description: "各倉即時庫存狀況表"
      - testid: "table-stock-ledger"
        type: "table"
        description: "雙記帳異動明細流水表記帳串流"

  procurement:
    route: "/procurement"
    elements:
      - testid: "form-create-po"
        type: "form"
        description: "快速建立採購單表單"
      - testid: "input-supplier-name"
        type: "input"
        description: "供應商名稱輸入框"
      - testid: "btn-create-po"
        type: "button"
        description: "建立 DRAFT 採購單送出按鈕"
      - testid: "table-procurement-orders"
        type: "table"
        description: "採購單流轉歷程清單表格"
      - testid: "procurement-orders-tbody"
        type: "tbody"
        description: "採購單列表資料主體"

  accounting:
    route: "/accounting"
    elements:
      - testid: "kpi-revenue"
        type: "card"
        description: "本期營業收入 KPI 卡片"
      - testid: "kpi-gross-profit"
        type: "card"
        description: "營業毛利 KPI 卡片"
      - testid: "kpi-net-profit"
        type: "card"
        description: "本期營業淨利 KPI 卡片"
      - testid: "kpi-ar-outstanding"
        type: "card"
        description: "應收帳款未收 (AR) KPI 卡片"
      - testid: "btn-export-trial-balance"
        type: "link"
        description: "匯出 Excel 試算表按鈕"
      - testid: "table-trial-balance"
        type: "table"
        description: "會計總分類帳試算表"
      - testid: "btn-export-income-statement"
        type: "link"
        description: "匯出 Excel 損益表按鈕"
      - testid: "table-income-statement"
        type: "table"
        description: "多步驟式損益表"

  crm:
    route: "/crm"
    elements:
      - testid: "btn-new-contact"
        type: "button"
        description: "新增客戶主檔按鈕"
      - testid: "btn-new-deal"
        type: "button"
        description: "建立新商機按鈕"
      - testid: "kanban-pipeline"
        type: "container"
        description: "四段商機管線看板容器"
      - testid: "kanban-col-lead"
        type: "column"
        description: "潛在商機 (LEAD) 看板欄位"
      - testid: "kanban-col-discovery"
        type: "column"
        description: "需求洽談 (DISCOVERY) 看板欄位"
      - testid: "kanban-col-proposal"
        type: "column"
        description: "方案報價 (PROPOSAL) 看板欄位"
      - testid: "kanban-col-won-lost"
        type: "column"
        description: "結案 (WON / LOST) 看板欄位"
